<!doctype html>
<!--
  Source for public/og-image.png (1200x630 social share card).
  Not part of the Vite build. To regenerate: open this file in a browser at a
  1200x630 viewport and screenshot it, or run it through any headless capture.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        background: #0d0d0d;
        color: #e8e8e8;
        font-family: 'SF Mono', 'Monaco', 'Consolas', 'Roboto Mono', monospace;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        position: relative;
      }

      .mark {
        font-size: 44px;
        font-weight: 600;
        color: #a78bfa;
        margin-bottom: 40px;
      }

      .name {
        font-size: 88px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .role {
        font-size: 34px;
        color: #a0a0a0;
        margin-top: 24px;
      }

      .domain {
        position: absolute;
        left: 96px;
        bottom: 64px;
        font-size: 24px;
        color: #808080;
      }

      .rule {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 8px;
        background: #a78bfa;
      }
    </style>
  </head>
  <body>
    <div class="mark">&gt;_</div>
    <div class="name">seth metcalf</div>
    <div class="role">full-stack engineer</div>
    <div class="domain">sethnijsmetcalf.com</div>
    <div class="rule"></div>
  </body>
</html>
